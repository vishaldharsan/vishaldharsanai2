<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Dharsan AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lockScreen">

    <div class="lock-box">

        <h2>🔐 Vishal Dharsan AI</h2>

        <p>Enter Password</p>

        <input 
            type="password" 
            id="passwordInput"
            placeholder="Password"
        >

        <button id="unlockBtn">
            Unlock AI
        </button>

        <p id="errorMsg"></p>

    </div>

</div>

    <div class="container">
        <div class="jarvis-core">

    <div class="hud-ring ring1"></div>
    <div class="hud-ring ring2"></div>
    <div class="hud-ring ring3"></div>

    <div class="ai-eye">
        <span></span>
    </div>

</div>

        <h1>🤖 Vishal Dharsan AI</h1>

        <p class="welcome">
            Hello Vishal 👋<br>
            I'm your personal AI assistant.
        </p>

        <div id="chatBox">

        </div>

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Ask me anything..."
            >

            <button id="sendBtn">
                Send
            </button>

        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
